name: Bug report
description: Report a reproducible problem.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes: { label: Problem description, description: What happened? }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce, placeholder: "1. ...\n2. ..." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: textarea
    id: observed
    attributes: { label: Observed behavior }
    validations: { required: true }
  - type: input
    id: os
    attributes: { label: Operating system and version }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Application version, placeholder: "Not applicable for development builds" }
  - type: textarea
    id: logs
    attributes: { label: Relevant logs, render: shell }
  - type: textarea
    id: evidence
    attributes: { label: Screenshots or other evidence }
