name: Feature request
description: Suggest a product improvement.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem to solve, description: What need or pain point does this address? }
    validations: { required: true }
  - type: textarea
    id: solution
    attributes: { label: Proposed solution }
    validations: { required: true }
  - type: textarea
    id: benefit
    attributes: { label: Expected benefit }
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives considered }
