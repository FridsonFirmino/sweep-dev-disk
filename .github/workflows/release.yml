name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");

          const tag = process.env.RELEASE_TAG;

          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(tag)) {
            throw new Error(`Invalid release tag: ${tag}`);
          }

          const tagVersion = tag.slice(1);

          const packageJson = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const tauriConfig = JSON.parse(
            fs.readFileSync("src-tauri/tauri.conf.json", "utf8")
          );

          const windowsConfig = JSON.parse(
            fs.readFileSync("src-tauri/tauri.windows.conf.json", "utf8")
          );

          const cargoMetadata = JSON.parse(
            execFileSync(
              "cargo",
              [
                "metadata",
                "--manifest-path",
                "src-tauri/Cargo.toml",
                "--no-deps",
                "--format-version",
                "1"
              ],
              { encoding: "utf8" }
            )
          );

          const cargoPackage = cargoMetadata.packages.find(
            (pkg) => pkg.name === "sweep-dev-disk"
          );

          if (!cargoPackage) {
            throw new Error("Tauri Cargo package not found.");
          }

          const versions = {
            package: packageJson.version,
            cargo: cargoPackage.version,
            tauri: tauriConfig.version
          };

          if (windowsConfig.version !== undefined) {
            versions.windows = windowsConfig.version;
          }

          for (const [source, version] of Object.entries(versions)) {
            if (version !== tagVersion) {
              throw new Error(
                `Version mismatch in ${source}: expected ${tagVersion}, received ${version}`
              );
            }
          }

          console.log("All project versions match the release tag.");
          console.log(versions);
          NODE

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: TypeScript check
        run: pnpm typecheck

      - name: Run frontend tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build-linux:
    name: Build Linux installers
    runs-on: ubuntu-latest
    needs: validate

    # Debian 12 is used as the build environment
    # to improve compatibility with older Linux systems.
    container:
      image: debian:12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          apt-get update

          apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libfuse2 \
            patchelf \
            ca-certificates \
            git \
            rpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux application
        run: pnpm tauri build --config src-tauri/tauri.conf.json

      - name: Collect Linux installers
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-artifacts

          find src-tauri/target/release/bundle \
            -type f \
            \( \
              -name "*.AppImage" -o \
              -name "*.deb" -o \
              -name "*.rpm" \
            \) \
            -print0 |
          while IFS= read -r -d '' file; do
            cp "$file" "release-artifacts/linux-$(basename "$file")"
          done

          if [ -z "$(find release-artifacts -type f -print -quit)" ]; then
            echo "No Linux installers were generated."
            exit 1
          fi

          echo "Linux installers:"
          ls -lh release-artifacts

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-linux
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows installers
    runs-on: windows-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows application
        run: pnpm tauri build --config src-tauri/tauri.windows.conf.json

      - name: Collect Windows installers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null

          $files = @()

          $files += Get-ChildItem `
            -Path "src-tauri/target/release/bundle/msi" `
            -Filter "*.msi" `
            -File `
            -ErrorAction SilentlyContinue

          $files += Get-ChildItem `
            -Path "src-tauri/target/release/bundle/nsis" `
            -Filter "*.exe" `
            -File `
            -ErrorAction SilentlyContinue

          if ($files.Count -eq 0) {
            throw "No Windows installers were generated."
          }

          foreach ($file in $files) {
            $destination = "release-artifacts/windows-$($file.Name)"
            Copy-Item $file.FullName $destination
          }

          Write-Host "Windows installers:"
          Get-ChildItem release-artifacts

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    needs:
      - build-linux
      - build-windows

    permissions:
      contents: write

    steps:
      - name: Download Linux and Windows installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail

          echo "Release assets:"

          find release-assets -type f -print

          if [ -z "$(find release-assets -type f -print -quit)" ]; then
            echo "No release assets found."
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" \
              --draft \
              --generate-notes \
              --verify-tag \
              --title "SweepDevDisk $TAG"
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r ASSET; do
            echo "Uploading: $ASSET"

            SUCCESS=false

            for ATTEMPT in 1 2 3 4 5; do
              if gh release upload "$TAG" "$ASSET" --clobber; then
                SUCCESS=true
                break
              fi

              WAIT=$((15 * 2 ** (ATTEMPT - 1)))

              echo "Upload failed. Retrying in ${WAIT}s..."
              sleep "$WAIT"
            done

            if [ "$SUCCESS" != "true" ]; then
              echo "Failed to upload $ASSET"
              exit 1
            fi

            sleep 2
          done < <(find release-assets -type f | sort)

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_ID=$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '.id')

          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false

          echo "SweepDevDisk $TAG published successfully."
